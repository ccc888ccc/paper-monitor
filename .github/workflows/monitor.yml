name: Paper Monitor

on:
  schedule:
    # 每天 UTC 00:00（台灣時間 08:00）執行
    # 如要改時間，修改 cron 表達式：https://crontab.guru/
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 允許手動在 GitHub Actions 頁面觸發（方便測試）

# 防止多個執行同時 push 造成衝突
concurrency:
  group: paper-monitor-push
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit state.json 回 repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper monitor
        env:
          # 這三個 Secrets 由使用者在 repo Settings → Secrets and variables → Actions 填入
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update state.json [skip ci]"
          # push 前先 rebase；若遠端又被更新就重試，最多 5 次
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin HEAD:master && break
            echo "push 第 $i 次失敗，重試中..."
            sleep 3
          done

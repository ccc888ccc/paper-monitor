name: Paper Monitor

on:
  schedule:
    # 每天 UTC 23:10（台灣時間隔日 07:10）排程
    # GitHub Actions 的排程是 best-effort，壅塞時段會被延遲數十分鐘到數小時。
    # UTC 00:00 前後是全球最壅塞的時段（大量每日任務都排在午夜 UTC），
    # 因此刻意把時間提早並挪離午夜壅塞區，讓加上延遲後落在台灣早上 8 點左右。
    # 也刻意避開整點（用 :10），整點同樣較容易塞車。
    # 如要改時間，修改 cron 表達式（UTC 時間）：https://crontab.guru/
    - cron: "10 23 * * *"
  workflow_dispatch:
    # 允許手動在 GitHub Actions 頁面觸發（方便測試）

# 防止多個執行同時 push 造成衝突
concurrency:
  group: paper-monitor-push
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit state.json 回 repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper monitor
        env:
          # 這三個 Secrets 由使用者在 repo Settings → Secrets and variables → Actions 填入
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update sta